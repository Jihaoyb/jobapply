services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobapply
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: jobapply
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobapply"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres:
